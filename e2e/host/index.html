<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Host site</title>
    <link rel="stylesheet" href="/lib/morse-code.css" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .site-header { display: flex; gap: 1rem; align-items: center; padding: 1rem; border-bottom: 1px solid #888; }
      .site-main { max-width: 1100px; margin: 0 auto; padding: 1rem; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <strong>Host site</strong>
      <button id="site-theme" type="button">Site: dark</button>
      <button id="site-unmount" type="button">Remove the app</button>
    </header>
    <main class="site-main">
      <p id="site-text">This paragraph belongs to the host page and must keep its own styling.</p>
      <div id="morse"></div>
    </main>
    <script type="module">
      import { mount } from '/lib/morse-code.js';
      const app = mount(document.getElementById('morse'), { theme: 'light' });
      window.__morse = app;
      document.getElementById('site-theme').addEventListener('click', () => app.setTheme('dark'));
      document.getElementById('site-unmount').addEventListener('click', () => app.unmount());
    </script>
  </body>
</html>
